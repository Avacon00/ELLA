name: Lint & Golden Rulebook Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate TOC, Locales & Golden Rulebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ELLA Golden Rulebook & Schema Validator
        run: python3 tests/validate_addon.py

      - name: Build Release ZIP Verification
        run: python3 scripts/build-release-zip.py

      - name: Run Luacheck (Anti-Taint & Global Leak Check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luacheck
          luacheck . --config .luacheckrc
