name: Package & Release (GitHub + CurseForge)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build, Publish GitHub Release & CurseForge
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate before packaging
        run: python3 tests/validate_addon.py

      - name: Build Release ZIP
        run: python3 scripts/build-release-zip.py

      - name: Create or Update GitHub Release with AddOn ZIP
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP_FILE=".release/ELLA-${TAG}-16001.zip"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP_FILE}" --clobber
          else
            gh release create "${TAG}" "${ZIP_FILE}" --title "${TAG}" --generate-notes
          fi

      - name: Package & Upload Addon to CurseForge (when CF_API_KEY is configured)
        if: ${{ env.CF_API_KEY != '' }}
        uses: BigWigsMods/packager@v2
